[package]
name = "miklfe"
version = "0.1.0"
edition = "2024"
description = "Widget de bureau natif reproduisant le skin Rainmeter Miklfe"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6.4"
wasapi = "0.26"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Correctif local : egui_glow réallouait ses buffers de sommets/indices avec
# `glBufferData` à chaque image. Sur le pilote NVIDIA de cette machine, cela
# fuit ~1 Ko par maillage et par image (plusieurs Go après quelques heures).
# La copie dans `vendor/egui_glow` alloue une fois puis utilise
# `glBufferSubData`. Voir `vendor/egui_glow/src/painter.rs`.
[patch.crates-io]
egui_glow = { path = "vendor/egui_glow" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

